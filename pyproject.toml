[project]
name = "multi-agent-wedding-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prajwal Deshpande" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langchain-openrouter>=0.2.9",
    "streamlit>=1.65.0",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.7.21",
]

[project.scripts]
multi-agent-wedding-planner = "multi_agent_wedding_planner:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
